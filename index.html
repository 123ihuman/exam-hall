<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Hall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { background: #f4f6f9; user-select: none; }
        .question-card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .option-label { display: block; padding: 10px 15px; border: 1px solid #dee2e6; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .option-label:hover { background: #f0f8ff; border-color: #0d6efd; }
        input[type="radio"]:checked + .option-label { background: #e0f0ff; border-color: #0d6efd; font-weight: bold; }
        #camera-feed { position: fixed; bottom: 20px; right: 20px; width: 160px; border-radius: 10px; border: 3px solid #dc3545; z-index: 1000; transform: scaleX(-1); }
        #timer-bar { position: sticky; top: 0; background: #212529; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 999; border-radius: 0 0 10px 10px; }
        .warning-flash { animation: flash 1s infinite; }
        @keyframes flash { 0% { background-color: #fff; } 50% { background-color: #ffcccc; } 100% { background-color: #fff; } }
    </style>
</head>
<body>

<div class="container mt-4 mb-5">
    <div class="card p-4 shadow-sm" id="main-card">
        <h2 class="mb-3">🎯 AI Exam Hall (External)</h2>
        
        <!-- SETUP SCREEN -->
        <div id="setup-screen">
            <div class="alert alert-warning"><strong>Strict Proctoring Active:</strong> Webcam must remain on. Tab switching will auto-submit the exam.</div>
            
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="fw-bold">1. Upload Book / PDF</label>
                    <input type="file" id="pdf-input" class="form-control" accept=".pdf" onchange="extractPdfText(this)">
                </div>
                <div class="col-md-6">
                    <label class="fw-bold">2. Admit Card (Verification)</label>
                    <input type="file" id="admit-card" class="form-control" accept="image/*" onchange="showAdmitCard(this)">
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="fw-bold">Number of Questions</label>
                    <input type="number" id="num-qs" class="form-control" value="5" min="1" max="20">
                </div>
                <div class="col-md-4">
                    <label class="fw-bold">Candidate Photo</label>
                    <button class="btn btn-outline-danger w-100" onclick="capturePhoto()">📷 Capture Face</button>
                    <span id="photo-status" class="text-muted small mt-1 d-block">Not captured</span>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-primary w-100 btn-lg" onclick="startExam()" id="btn-start" disabled>Start Exam</button>
                </div>
            </div>
        </div>

        <!-- LOADING -->
        <div id="loading-screen" style="display:none;" class="text-center py-5">
            <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;"></div>
            <h4>AI is framing your paper...</h4>
        </div>

        <!-- EXAM SCREEN -->
        <div id="exam-screen" style="display:none;">
            <div id="timer-bar">
                <div>⏱️ Time Left: <span id="timer-display">45:00</span></div>
                <div id="proctor-status" class="fw-bold text-success">🟢 Face Detected</div>
                <button class="btn btn-sm btn-danger" onclick="submitExam()">Submit Exam</button>
            </div>
            <div id="questions-container" class="mt-4"></div>
            <button class="btn btn-success w-100 mt-3 mb-5" onclick="submitExam()">Final Submit</button>
        </div>

        <!-- RESULTS SCREEN -->
        <div id="results-screen" style="display:none;">
            <h3 class="text-center text-success">Exam Completed!</h3>
            <h1 class="text-center display-1 fw-bold" id="result-score">0/0</h1>
            <div id="results-detailed" class="mt-4"></div>
            <div class="text-center mt-4"><a href="https://umadivy500.pythonanywhere.com" class="btn btn-primary">Return to Main App</a></div>
        </div>
    </div>
</div>

<video id="camera-feed" autoplay muted></video>

<script>
// Set PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let currentQuestions = [];
let extractedText = "";
let timerInterval = null;
let timeLeft = 45 * 60;
let tabSwitchCount = 0;
let faceCheckInterval = null;
let faceMissingCount = 0;
let isExamActive = false;

const video = document.getElementById('camera-feed');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

// 1. Extract Text Client-Side
async function extractPdfText(input) {
    if (!input.files[0]) return;
    let file = input.files[0];
    let reader = new FileReader();
    reader.onload = async function(e) {
        let typedarray = new Uint8Array(e.target.result);
        let pdf = await pdfjsLib.getDocument(typedarray).promise;
        extractedText = "";
        for (let i = 1; i <= Math.min(5, pdf.numPages); i++) {
            let page = await pdf.getPage(i);
            let textContent = await page.getTextContent();
            extractedText += textContent.items.map(s => s.str).join(" ") + "\\n";
        }
        document.getElementById('pdf-input').classList.add('is-valid');
        checkReady();
    };
    reader.readAsArrayBuffer(file);
}

// 2. Webcam & Proctoring
document.addEventListener('DOMContentLoaded', async () => {
    try {
        let stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
    } catch(e) { alert("Webcam required."); }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden && isExamActive) {
            tabSwitchCount++;
            playBeep();
            alert(`⚠️ WARNING: Tab switching detected! (${tabSwitchCount}/2). Auto-submit on next violation.`);
            if (tabSwitchCount >= 2) submitExam();
        }
    });
});

function playBeep() {
    try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    } catch(e){}
}

function checkFace() {
    if (!isExamActive || video.paused || video.ended) return;
    canvas.width = 40; canvas.height = 30;
    ctx.drawImage(video, 0, 0, 40, 30);
    let frame = ctx.getImageData(0, 0, 40, 30);
    let data = frame.data;
    let variance = 0;
    for(let i=0; i<data.length; i+=4) { variance += Math.abs(data[i] - data[i+4]); }
    
    if (variance < 100) {
        faceMissingCount++;
        if (faceMissingCount > 3) {
            document.getElementById('proctor-status').innerText = '🔴 NO FACE DETECTED!';
            document.getElementById('proctor-status').className = 'fw-bold text-danger';
            document.getElementById('main-card').classList.add('warning-flash');
            playBeep();
        }
    } else {
        faceMissingCount = 0;
        document.getElementById('proctor-status').innerText = '🟢 Face Detected';
        document.getElementById('proctor-status').className = 'fw-bold text-success';
        document.getElementById('main-card').classList.remove('warning-flash');
    }
}

function showAdmitCard(input) {
    if (input.files && input.files[0]) {
        document.getElementById('admit-card').classList.add('is-valid');
        checkReady();
    }
}

function capturePhoto() {
    canvas.width = 200; canvas.height = 200;
    ctx.drawImage(video, 0, 0, 200, 200);
    document.getElementById('photo-status').innerText = "✅ Photo Captured";
    document.getElementById('photo-status').className = "text-success small mt-1 d-block";
    checkReady();
}

function checkReady() {
    let pdf = document.getElementById('pdf-input').classList.contains('is-valid');
    let admit = document.getElementById('admit-card').classList.contains('is-valid');
    let photo = document.getElementById('photo-status').innerText.includes('✅');
    document.getElementById('btn-start').disabled = !(pdf && admit && photo);
}

// 3. Start Exam
async function startExam() {
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'block';
    isExamActive = true;

    let numQs = parseInt(document.getElementById('num-qs').value);

    try {
        let res = await fetch('https://umadivy500.pythonanywhere.com/api/exam-generate-questions', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ text: extractedText, num_qs: numQs })
        });
        let data = await res.json();
        if(data.error) throw new Error(data.error);
        
        currentQuestions = data.questions;
        renderExam();
    } catch(e) {
        alert("Failed: " + e.message);
        location.reload();
    }
}

function renderExam() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('exam-screen').style.display = 'block';

    document.getElementById('questions-container').innerHTML = currentQuestions.map((q, i) => `
        <div class="question-card">
            <h5 class="fw-bold">Q${i+1}. ${q.question}</h5>
            <div class="options mt-3">
                ${q.options && q.options.length ? q.options.map((opt, oi) => `
                    <label class="w-100">
                        <input type="radio" name="q_${i}" value="${String.fromCharCode(65+oi)}" style="display:none;">
                        <span class="option-label">${String.fromCharCode(65+oi)}) ${opt}</span>
                    </label>
                `).join('') : ''}
            </div>
        </div>
    `).join('');

    faceCheckInterval = setInterval(checkFace, 1000);

    timerInterval = setInterval(() => {
        if (timeLeft <= 0) { clearInterval(timerInterval); submitExam(); }
        timeLeft--;
        let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        let s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
    }, 1000);
}

// 4. Submit & Sync to Main App
async function submitExam() {
    clearInterval(timerInterval);
    clearInterval(faceCheckInterval);
    isExamActive = false;
    document.getElementById('exam-screen').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';

    let score = 0;
    let detailedHtml = '';

    currentQuestions.forEach((q, i) => {
        let selectedEl = document.querySelector(`input[name="q_${i}"]:checked`);
        let userAns = selectedEl ? selectedEl.value : "Skipped";
        let correct = (q.correct_answer || "").toUpperCase();
        if(userAns === correct) score++;

        detailedHtml += `
            <div class="card mb-2 p-3 ${userAns === correct ? 'border-success' : 'border-danger'}">
                <h6 class="fw-bold">Q${i+1}. ${q.question}</h6>
                <div class="text-${userAns === correct?'success':'danger'} small">Your Ans: ${userAns}</div>
                <div class="text-success small">Correct: ${q.correct_answer}</div>
                <div class="text-muted small"><i>${q.explanation || ''}</i></div>
            </div>`;
    });

    document.getElementById('result-score').innerText = `${score} / ${currentQuestions.length}`;
    document.getElementById('results-detailed').innerHTML = detailedHtml;

    // Sync to Main PythonAnywhere App
    try {
        await fetch('https://umadivy500.pythonanywhere.com/api/exam-save-result', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ score: score, total: currentQuestions.length, time_taken: (45*60) - timeLeft })
        });
        console.log("Result synced to cloud");
    } catch(e) { console.log("Sync failed", e); }

    if(video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.style.display = 'none'; }
}
</script>
</body>
</html>
